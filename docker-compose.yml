version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexbid-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: nexbid
      POSTGRES_PASSWORD: superuser001
      POSTGRES_DB: nexbid_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexbid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
